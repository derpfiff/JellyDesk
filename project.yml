name: JellyDesk

options:
  bundleIdPrefix: io.github.derpfiff
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    from: 1.0.0

settings:
  base:
    # "5.0" ist der Sprachmodus Swift 5 (gilt für alle 5.x-Compiler, also auch 5.10).
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  JellyDesk:
    type: application
    platform: macOS
    sources:
      - path: JellyDesk
    dependencies:
      - package: MPVKit
        product: MPVKit
    # Bundle-ID und Signatur stehen in Config/Base.xcconfig und lassen sich in
    # Config/Local.xcconfig (nicht eingecheckt) überschreiben.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_NAME: JellyDesk
        INFOPLIST_FILE: JellyDesk/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: JellyDesk/JellyDesk.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

schemes:
  JellyDesk:
    build:
      targets:
        JellyDesk: all
    run:
      config: Debug
      # MoltenVK stürzt mit eingeschalteter Metal-API-Prüfung bei HDR-Videos ab
      # (KhronosGroup/MoltenVK#2226), deshalb im Schema abgeschaltet.
      enableGPUValidationMode: false
    archive:
      config: Release
